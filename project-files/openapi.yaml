          schema:
            $ref: '#/components/schemas/DepartmentSingleResponse'
    IssuesCollection:
      description: Issue list
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IssuesCollectionResponse'
    IssueSingle:
      description: Issue payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IssueSingleResponse'
    CommentsCollection:
      description: Comment list
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommentsCollectionResponse'
    CommentSingle:
      description: Comment payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommentSingleResponse'
    IssueRelationsCollection:
      description: Issue relation list
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IssueRelationsCollectionResponse'
    IssueRelationSingle:
      description: Issue relation payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/IssueRelationSingleResponse'
    WikiPagesCollection:
      description: Wiki page list
      content:
        application/json:
          schema:
