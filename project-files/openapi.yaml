components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    Unauthorized:
      description: Authentication failed or no bearer token was provided
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not allowed to access the resource
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProjectsCollection:
      description: Project list
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectsCollectionResponse'
    ProjectSingle:
      description: Project payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectSingleResponse'
    ProjectMembersCollection:
      description: Project membership list
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectMembersCollectionResponse'
    ProjectMemberSingle:
      description: Project membership payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectMemberSingleResponse'
    StatusesCollection:
      description: Status list
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusesCollectionResponse'
    StatusSingle:
      description: Status payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusSingleResponse'
    DepartmentsCollection:
      description: Department list
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DepartmentsCollectionResponse'
    DepartmentSingle:
      description: Department payload
      content:
