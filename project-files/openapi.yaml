openapi: 3.1.0
info:
  title: Lopusboard Backend API
  version: 0.1.0
  description: >
    Current backend API representation based on the existing CakePHP routes,
    controllers, tests, and schema. This document reflects the API as it exists
    today, including its flat `/api/*` resource structure. Only verified
    request shapes are documented here. Query parameters are intentionally
    omitted unless they are part of the explicit current contract.
servers:
  - url: http://localhost:8765
    description: Local development server
security:
  - bearerAuth: []
tags:
  - name: Identity
  - name: Projects
  - name: Project Members
  - name: Statuses
  - name: Departments
  - name: Issues
  - name: Comments
  - name: Issue Relations
  - name: Wiki Pages
  - name: Wiki Page Revisions
  - name: Attachments
  - name: Activity Log
paths:
  /api/identity/me:
    get:
      tags: [Identity]
      summary: Return the current authenticated identity
      operationId: identityMe
      responses:
        '200':
          description: Authenticated identity summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityMeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/projects:
    get:
      tags: [Projects]
      summary: List accessible projects
      operationId: listProjects
      responses:
        '200':
          $ref: '#/components/responses/ProjectsCollection'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Projects]
      summary: View a project
      operationId: getProject
      responses:
        '200':
          $ref: '#/components/responses/ProjectSingle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Projects]
      summary: Update a project
      operationId: updateProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdateInput'
      responses:
        '200':
          $ref: '#/components/responses/ProjectSingle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Projects]
      summary: Delete a project
      operationId: deleteProject
      responses:
        '204':
          description: Project deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/project-members:
    get:
      tags: [Project Members]
      summary: List accessible project memberships
      operationId: listProjectMembers
